# Default settings. Any key can be overridden with a JVM system property
# (-Dbrowser=edge) or an environment variable (BROWSER=edge).
# Secrets (passwords, tokens) must NOT be added here; supply them via environment variables.

base.url=https://www.saucedemo.com
browser=chrome
headless=true
explicit.wait.seconds=10

# ---- Mobile (Appium) ----
appium.server.url=http://127.0.0.1:4723
# Sauce Labs "My Demo App" Android 2.3.0, downloaded into apps/ (see README)
android.app.path=apps/mda-2.3.0-27.apk
mobile.wait.seconds=15
mobile.username=bod@example.com
# mobile.password comes from the MOBILE_PASSWORD environment variable
